[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-treza"
version = "0.1.0"
description = "Treza tools for CrewAI: generate AI pictures and videos and run Treza pipelines, with a price cap on every render."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Treza Labs, Inc.", email = "hello@trezalabs.com" }]
keywords = ["crewai", "treza", "ai video", "image generation", "video generation", "tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "crewai>=0.100.0,<2",
    "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://www.trezalabs.com"
Repository = "https://github.com/treza-labs/crewai-treza"
Issues = "https://github.com/treza-labs/crewai-treza/issues"

[tool.hatch.build.targets.wheel]
packages = ["crewai_treza"]

[tool.pytest.ini_options]
testpaths = ["tests"]
